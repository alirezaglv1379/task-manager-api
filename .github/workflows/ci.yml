name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  backend:
    name: Backend quality and tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests scripts alembic
      - name: Tests and coverage
        run: pytest --cov=app.core --cov=app.services --cov-report=term-missing --cov-fail-under=80
      - name: Dependency audit
        run: pip-audit -r requirements-dev.txt
      - name: Fresh migration smoke test
        run: python -m scripts.migrate_db
        env:
          DATABASE_URL: sqlite:///./ci-smoke.db
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      - name: Verify migration head
        run: alembic current
        env:
          DATABASE_URL: sqlite:///./ci-smoke.db
          SECRET_KEY: ci-only-secret-key-not-for-production-0123456789


  frontend:
    name: Frontend typecheck and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dependency audit
        run: npm audit --audit-level=moderate

      - name: Frontend tests
        run: npm run test

      - name: Production build
        run: npm run build
